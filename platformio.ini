[platformio]
default_envs = esp32s3-ota

[env]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino

build_flags =

monitor_speed = 115200
upload_speed = 921600

lib_deps = adafruit/Adafruit NeoPixel @ ^1.12.4

[env:esp32s3-usb]
extends = env

[env:esp32s3-ota]
extends = env
upload_protocol = espota
upload_port = 192.168.123.116
upload_flags =
    --auth=esp32s3!
    --host_ip=192.168.123.118

; ==========================================
; OTA upload settings
; ==========================================
; If the board IP changes, update upload_port before the next OTA upload.
; If the PC Wi-Fi IP changes, update --host_ip to the current Wi-Fi address.
