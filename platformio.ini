[platformio]
default_envs = esp32s3-usb

[env]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino

build_flags =

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.4
    knolleary/PubSubClient @ ^2.8

[env:esp32s3-usb]
extends = env

[env:esp32s3-cam-usb]
extends = env
lib_deps =
    ${env.lib_deps}
    espressif/esp32-camera
    links2004/WebSockets
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_CAMERA

; ==========================================
; OTA upload settings
; ==========================================
; New boards should be flashed with env:esp32s3-usb first.
; Board-specific OTA targets belong in ignored platformio.local.ini.
; Use platformio.ota.example.ini as the template.
; Do not commit OTA passwords, board IPs, or local host IPs.
