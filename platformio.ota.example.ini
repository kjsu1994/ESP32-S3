[platformio]
default_envs = esp32s3-cam-livingroom-ota

[env]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino

build_flags =

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.4
    knolleary/PubSubClient @ ^2.8

[env:esp32s3-livingroom-ota]
extends = env
upload_protocol = espota
upload_port = 192.168.0.50
upload_flags =
    --auth=CHANGE_ME
    --host_ip=192.168.0.10

[env:esp32s3-cam-livingroom-ota]
extends = env
lib_deps =
    ${env.lib_deps}
    espressif/esp32-camera
    links2004/WebSockets
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_CAMERA
upload_protocol = espota
upload_port = 192.168.0.51
upload_flags =
    --auth=CHANGE_ME
    --host_ip=192.168.0.10
